services:
  # 📌 1. Primary DB
  db-primary:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_DATABASE=flash_sale_db
    ports:
      - "5432:5432"

  # 📌 2. Replica DB
  db-replica:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=db-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
    ports:
      - "5433:5432"
    depends_on:
      - db-primary

  # 📌 3. Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # 📌 4. API Instance 1
  api1:
    build: .
    ports:
      - "3001:3000"
    environment:
      - INSTANCE_ID=Instance-1
      - DB_MASTER_HOST=db-primary
      - DB_REPLICA_HOST=db-replica
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db-primary
      - db-replica
      - redis

  # 📌 5. API Instance 2
  api2:
    build: .
    ports:
      - "3002:3000"
    environment:
      - INSTANCE_ID=Instance-2
      - DB_MASTER_HOST=db-primary
      - DB_REPLICA_HOST=db-replica
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db-primary
      - db-replica
      - redis

  # 📌 6. API Instance 3
  api3:
    build: .
    ports:
      - "3003:3000"
    environment:
      - INSTANCE_ID=Instance-3
      - DB_MASTER_HOST=db-primary
      - DB_REPLICA_HOST=db-replica
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db-primary
      - db-replica
      - redis

  # 📌 7. Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  redis-data: