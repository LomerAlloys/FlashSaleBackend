services:
  # 📌 1. PostgreSQL (single instance, no replication)
  postgres:
    image: bitnami/postgresql:latest
    environment:
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_DATABASE=flash_sale_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/bitnami/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d flash_sale_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 📌 2. Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # 📌 3. API Instance 1
  api1:
    build: .
    ports:
      - "3001:3000"
    environment:
      - INSTANCE_ID=Instance-1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 📌 4. API Instance 2
  api2:
    build: .
    ports:
      - "3002:3000"
    environment:
      - INSTANCE_ID=Instance-2
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 📌 5. API Instance 3
  api3:
    build: .
    ports:
      - "3003:3000"
    environment:
      - INSTANCE_ID=Instance-3
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 📌 6. Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  redis-data:
  postgres-data:
