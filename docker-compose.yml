services:
  # 📌 1. PostgreSQL (single instance, no replication)
  postgres:
    image: bitnami/postgresql:latest
    volumes:
      - postgres-data:/bitnami/postgresql
    environment:
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_DATABASE=flash_sale_db
      - POSTGRESQL_SHARED_BUFFERS=256MB
      - POSTGRESQL_MAX_CONNECTIONS=200
      - POSTGRESQL_EXTRA_FLAGS=-c synchronous_commit=off -c work_mem=32MB -c wal_buffers=16MB
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d flash_sale_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 📌 2. Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --tcp-backlog 65535 --maxmemory 1gb --maxmemory-policy noeviction --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

  # 📌 3. One-off migration runner
  migrate:
    build:
      context: .
      target: build
    command: npm run migration:run:compiled
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
    depends_on:
      postgres:
        condition: service_healthy

  # 📌 4. API Instance 1
  api1:
    build: .
    ports:
      - "3001:3000"
    environment:
      - INSTANCE_ID=Instance-1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 📌 5. API Instance 2
  api2:
    build: .
    ports:
      - "3002:3000"
    environment:
      - INSTANCE_ID=Instance-2
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 📌 6. API Instance 3
  api3:
    build: .
    ports:
      - "3003:3000"
    environment:
      - INSTANCE_ID=Instance-3
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 📌 7. API Instance 4 (Match 4 CPU Cores)
  api4:
    build: .
    ports:
      - "3004:3000"
    environment:
      - INSTANCE_ID=Instance-4
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=flash_sale_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=local-dev-flash-sale-jwt-secret-do-not-use-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 📌 8. Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - /dev/shm:/dev/shm
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
      api4:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
