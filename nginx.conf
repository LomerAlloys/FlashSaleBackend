worker_processes 1;

events {
    worker_connections 4096;
}

http {
    # กำหนดกลุ่มของ Backend (ใช้ชื่อ Service จาก Docker Compose)
    upstream backend_servers {
        # กำหนดค่า max_fails และ fail_timeout สำหรับ Passive Health Check (Part 4)
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            # ส่ง Request ไปยังกลุ่ม backend_servers แบบ Round Robin
            proxy_pass http://backend_servers;
            
            # ส่ง Header สำคัญต่อไปให้ Backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}