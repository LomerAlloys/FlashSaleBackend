worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    reset_timedout_connection on;

    proxy_cache_path /dev/shm/nginx_cache levels=1:2 keys_zone=PRODUCTS_CACHE:10m max_size=100m inactive=2s;

    upstream backend_servers {
        server api1:3000 max_fails=3 fail_timeout=5s;
        server api2:3000 max_fails=3 fail_timeout=5s;
        server api3:3000 max_fails=3 fail_timeout=5s;
        server api4:3000 max_fails=3 fail_timeout=5s;
        keepalive 1024;
    }

    server {
        listen 80 backlog=16384 reuseport;

        # 📖 1. Micro-cached Read (GET /products)
        location /api/v1/products {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache PRODUCTS_CACHE;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # 🛍️ 2. High-Speed Orders Direct Channel
        location /api/v1/orders {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_next_upstream off;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 16 128k;
            proxy_busy_buffers_size 256k;
        }

        # 🌐 3. All other routes
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
