worker_processes 1;

events {
    worker_connections 4096;
}

http {
    # กำหนดกลุ่มของ Backend (ใช้ชื่อ Service จาก Docker Compose)
    upstream backend_servers {
        least_conn;
        # กำหนดค่า max_fails และ fail_timeout สำหรับ Passive Health Check (Part 4)
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
        # เก็บ connection ไปหา backend ไว้ reuse (ไม่เปิด TCP handshake ใหม่ทุก request)
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            # ส่ง Request ไปยังกลุ่ม backend_servers แบบ Least Connection
            proxy_pass http://backend_servers;

            # จำเป็นสำหรับให้ keepalive ไปยัง upstream ทำงาน (HTTP/1.1 + ไม่ปิด Connection header)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # ส่ง Header สำคัญต่อไปให้ Backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}